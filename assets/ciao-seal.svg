<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">ciao os journal sticker</title>
  <desc id="desc">A hand-drawn cream and yellow sticker with an eye, stars, a heart, and the words ciao os and made of memories.</desc>
  <defs>
    <filter id="paper-shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="4" dy="6" stdDeviation="1.8" flood-color="#3c2935" flood-opacity=".22"/>
    </filter>
    <pattern id="blue-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#dbe4ef"/>
      <path d="M8 0H0V8" fill="none" stroke="#8eb8ff" stroke-width=".8" opacity=".8"/>
    </pattern>
  </defs>

  <!-- loose die-cut edge -->
  <path d="M87 9c14-2 27 5 37 13 13 1 27 6 34 18 8 11 6 25 10 37 5 12 5 27-2 38-4 13-15 22-25 30-9 11-22 18-36 18-12 6-28 6-40 0-14 0-27-7-35-18-12-6-20-18-22-31-7-11-6-26-1-38-2-14 2-29 12-39 7-12 19-20 32-23 10-7 24-7 36-5Z" fill="#fffaf2" filter="url(#paper-shadow)"/>
  <path d="M88 17c13-2 24 5 33 12 13 0 24 5 31 16 7 10 5 23 9 34 5 11 4 23-2 33-4 12-14 20-23 27-8 10-20 15-32 15-12 6-25 5-36 0-13 0-24-6-32-16-11-6-18-17-20-28-6-10-5-23-1-34-2-13 2-25 11-34 6-11 17-18 29-20 9-6 22-7 33-5Z" fill="#ffe55f" stroke="#3c2935" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M88 22c12-2 22 4 31 11 11 1 22 5 28 15 6 9 4 20 8 31 4 10 3 21-2 30-4 10-13 18-22 24-7 8-17 13-28 13-10 5-22 4-32 0-11 0-21-6-28-14-10-5-16-15-18-25-5-9-4-21-1-31-1-11 2-22 10-30 6-9 16-15 26-17 9-5 19-6 28-4Z" fill="none" stroke="#3c2935" stroke-width="1.1" stroke-dasharray="2 4" stroke-linecap="round" opacity=".7"/>

  <!-- scrapbook tape -->
  <path d="M125 17l31 8-6 24-31-8Z" fill="url(#blue-grid)" stroke="#3c2935" stroke-width="1.2" opacity=".92"/>
  <path d="M127 18l28 7M121 39l28 7" fill="none" stroke="#fffaf2" stroke-width="1" opacity=".75"/>

  <!-- hand-lettered heading -->
  <text x="84" y="49" text-anchor="middle" fill="#3c2935" font-family="Comic Sans MS, Segoe Print, cursive" font-size="20" font-weight="700" transform="rotate(-3 84 49)">ciao os</text>
  <path d="M51 54c20 4 44 4 65-1" fill="none" stroke="#ff8752" stroke-width="4" stroke-linecap="round" opacity=".8"/>

  <!-- sketched eye -->
  <path d="M44 91c13-18 29-25 43-24 16 0 31 9 43 23-12 14-28 22-44 22-16 0-31-7-42-21Z" fill="#fffaf2" stroke="#3c2935" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M49 90c12-9 24-14 38-14 14 0 26 5 38 14-12 9-25 14-39 14-14 0-26-5-37-14Z" fill="none" stroke="#3c2935" stroke-width="1.2" opacity=".55"/>
  <circle cx="86" cy="90" r="14" fill="#8eb8ff" stroke="#3c2935" stroke-width="2.4"/>
  <circle cx="86" cy="90" r="6" fill="#3c2935"/>
  <circle cx="82" cy="86" r="2" fill="#fffaf2"/>
  <path d="M86 60l-1-9M64 65l-5-8M108 66l6-8M42 77l-9-4M132 79l9-3M47 110l-8 5M125 110l8 6" fill="none" stroke="#3c2935" stroke-width="2.4" stroke-linecap="round"/>

  <!-- tiny sticker doodles -->
  <path d="M39 57c-5-8-15-2-10 6l10 11 10-11c5-8-5-14-10-6Z" fill="#ff9fc8" stroke="#3c2935" stroke-width="1.7"/>
  <path d="M137 99l2 7 7 2-7 2-2 7-2-7-7-2 7-2Z" fill="#bdeb62" stroke="#3c2935" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M29 92l1 4 4 1-4 1-1 4-1-4-4-1 4-1Z" fill="#fffaf2" stroke="#3c2935" stroke-width="1.2"/>

  <text x="87" y="132" text-anchor="middle" fill="#3c2935" font-family="Courier New, monospace" font-size="9.2" font-weight="700" letter-spacing="1.5">MADE OF MEMORIES</text>
  <path d="M48 138c23 5 53 4 77-1" fill="none" stroke="#3c2935" stroke-width="1.4" stroke-linecap="round"/>
  <text x="86" y="149" text-anchor="middle" fill="#7d4169" font-family="Comic Sans MS, Segoe Print, cursive" font-size="7.8" transform="rotate(1 86 149)">open a little window ♡</text>
</svg>
